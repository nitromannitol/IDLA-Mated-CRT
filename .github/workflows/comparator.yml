name: Comparator audit

# Runs the official leanprover/comparator on every MatedCRTAudit/<Pair>: for each pair it checks
# that Solution proves statements whose full dependency closure matches Challenge's, that only the
# permitted axioms are used, and that the proofs are accepted by BOTH the Lean kernel (replay) and the
# independent nanoda kernel. The library build is the one of the CI workflow (`build-stage.yml`,
# resumed here if it is not complete), against Harmonic-Balls-LQG at the head of its main branch or at
# the commit given to the dispatch. It runs on manual dispatch.
on:
  workflow_dispatch:
    inputs:
      harmonic_balls_rev:
        description: Commit of Harmonic-Balls-LQG to build against (default the head of its main branch)
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: comparator-${{ github.ref }}
  cancel-in-progress: false

env:
  COMPARATOR_REV: "575674928e239f5bc452aab72d1dd7b0f1326494"  # leanprover/comparator
  LEAN4EXPORT_REV: "v4.35.0-rc2"                              # MUST match ./lean-toolchain
  NANODA_REV: "6ae1f0cd962f081f6c423454c5da729d841236a7"      # ammkrn/nanoda_lib
  LANDRUN_REV: "811cfff51ceaf3d9843708aa6d22e9b84ccac8b4"     # Zouuup/landrun

jobs:
  resolve:
    name: Resolve the Harmonic-Balls-LQG commit
    runs-on: ubuntu-24.04
    outputs:
      rev: ${{ steps.rev.outputs.rev }}
    steps:
      - id: rev
        shell: bash
        env:
          REQUESTED: ${{ inputs.harmonic_balls_rev }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            rev="$REQUESTED"
          else
            rev=$(git ls-remote https://github.com/nitromannitol/Harmonic-Balls-LQG refs/heads/main | cut -f1)
          fi
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || { echo "Not a commit: $rev"; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "Built against Harmonic-Balls-LQG $rev" >> "$GITHUB_STEP_SUMMARY"

  stage1:
    needs: [resolve]
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 1
      harmonic_balls_rev: ${{ needs.resolve.outputs.rev }}
  stage2:
    needs: [resolve, stage1]
    if: needs.stage1.outputs.complete != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 2
      harmonic_balls_rev: ${{ needs.resolve.outputs.rev }}
  stage3:
    needs: [resolve, stage2]
    if: needs.stage2.outputs.complete != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 3
      harmonic_balls_rev: ${{ needs.resolve.outputs.rev }}
  stage4:
    needs: [resolve, stage3]
    if: needs.stage3.outputs.complete != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 4
      harmonic_balls_rev: ${{ needs.resolve.outputs.rev }}
  stage5:
    needs: [resolve, stage4]
    if: needs.stage4.outputs.complete != 'true'
    uses: ./.github/workflows/build-stage.yml
    with:
      stage: 5
      harmonic_balls_rev: ${{ needs.resolve.outputs.rev }}
  comparator:
    name: Comparator over the audit pairs
    needs: [resolve, stage1, stage2, stage3, stage4, stage5]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          path: IDLA-Mated-CRT
          persist-credentials: false

      - name: Checkout Harmonic-Balls-LQG
        uses: actions/checkout@v5
        with:
          repository: nitromannitol/Harmonic-Balls-LQG
          ref: ${{ needs.resolve.outputs.rev }}
          path: Harmonic-Balls-LQG
          persist-credentials: false

      - name: Reclaim runner disk space and enlarge swap
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/powershell \
                      /usr/share/swift /usr/local/share/boost \
                      /usr/local/share/chromium /opt/google /opt/microsoft \
                      /usr/lib/jvm /usr/lib/google-cloud-sdk /opt/az /usr/local/julia* || true
          sudo docker system prune --all --force >/dev/null 2>&1 || true
          sudo sysctl -w vm.max_map_count=262144
          sudo swapoff -a || true
          swapdir=/mnt
          [ -d "$swapdir" ] || swapdir="${RUNNER_TEMP:-/tmp}"
          sudo rm -f "$swapdir/comparator-swapfile"
          sudo fallocate -l 32G "$swapdir/comparator-swapfile"
          sudo chmod 600 "$swapdir/comparator-swapfile"
          sudo mkswap "$swapdir/comparator-swapfile"
          sudo swapon "$swapdir/comparator-swapfile"
          free -h
          df -h /

      - name: Set up Lean and fetch the Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          use-mathlib-cache: true
          lake-package-directory: IDLA-Mated-CRT

      - name: Restore the build
        uses: actions/cache/restore@v4
        with:
          path: |
            IDLA-Mated-CRT/.lake/build
            IDLA-Mated-CRT/.lake/packages/*/.lake/build
            !IDLA-Mated-CRT/.lake/packages/mathlib/.lake/build
            Harmonic-Balls-LQG/.lake/build
          key: lake-all-${{ hashFiles('IDLA-Mated-CRT/lean-toolchain', 'IDLA-Mated-CRT/lake-manifest.json') }}-${{ github.sha }}-
          restore-keys: |
            lake-all-${{ hashFiles('IDLA-Mated-CRT/lean-toolchain', 'IDLA-Mated-CRT/lake-manifest.json') }}-${{ github.sha }}-
            lake-all-${{ hashFiles('IDLA-Mated-CRT/lean-toolchain', 'IDLA-Mated-CRT/lake-manifest.json') }}-

      - name: Require the complete library build and build the audit surface
        shell: bash
        working-directory: IDLA-Mated-CRT
        run: |
          set -o pipefail
          lake build --no-build
          lake build MatedCRTAudit 2>&1 | tee audit-build.log

      - name: Restore verification tools
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/tools
          key: cmp-tools-${{ env.COMPARATOR_REV }}-${{ env.LEAN4EXPORT_REV }}-${{ env.NANODA_REV }}-${{ env.LANDRUN_REV }}

      - name: Build comparator
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/comparator ~/tools/comparator
          git -C ~/tools/comparator checkout "$COMPARATOR_REV"
          cd ~/tools/comparator && lake build

      - name: Build lean4export (toolchain-matched)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/leanprover/lean4export ~/tools/lean4export
          git -C ~/tools/lean4export checkout "$LEAN4EXPORT_REV"
          test "$(cat ~/tools/lean4export/lean-toolchain)" = "$(cat IDLA-Mated-CRT/lean-toolchain)" \
            || { echo "lean4export toolchain does not match project toolchain"; exit 1; }
          cd ~/tools/lean4export && lake build

      - name: Set up Go (for landrun)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build landrun (static)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/Zouuup/landrun ~/tools/landrun-src
          git -C ~/tools/landrun-src checkout "$LANDRUN_REV"
          mkdir -p ~/tools/bin
          cd ~/tools/landrun-src && CGO_ENABLED=0 go build -o ~/tools/bin/landrun ./cmd/landrun

      - name: Build nanoda
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          command -v rustup >/dev/null || {
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain none
            . "$HOME/.cargo/env"
          }
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          git clone https://github.com/ammkrn/nanoda_lib ~/tools/nanoda_lib
          git -C ~/tools/nanoda_lib checkout "$NANODA_REV"
          cd ~/tools/nanoda_lib && cargo +stable build --release

      - name: Save verification tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/tools
          key: cmp-tools-${{ env.COMPARATOR_REV }}-${{ env.LEAN4EXPORT_REV }}-${{ env.NANODA_REV }}-${{ env.LANDRUN_REV }}

      - name: Check that the sandbox refuses an outside write
        shell: bash
        run: |
          probe="$RUNNER_TEMP/landrun-probe"
          ~/tools/bin/landrun --best-effort --ro / --rw /dev -ldd -add-exec -- /bin/true
          ~/tools/bin/landrun --best-effort --ro / --rw /dev -ldd -add-exec \
            -- /bin/sh -c 'printf escaped > "$1"' sh "$probe" || true
          if [ -e "$probe" ]; then
            echo "landrun did not enforce the sandbox: a write outside it succeeded."
            exit 1
          fi

      - name: Run the comparator on every pair
        env:
          COMPARATOR_LANDRUN: /home/runner/tools/bin/landrun
          COMPARATOR_LEAN4EXPORT: /home/runner/tools/lean4export/.lake/build/bin/lean4export
          COMPARATOR_NANODA: /home/runner/tools/nanoda_lib/target/release/nanoda_bin
        shell: bash
        working-directory: IDLA-Mated-CRT
        run: |
          set -euo pipefail
          mkdir -p comparator-logs
          fail=0
          checked=0
          for cfg in MatedCRTAudit/*/comparator.json; do
            X="$(basename "$(dirname "$cfg")")"
            echo "::group::$X"
            if lake env ~/tools/comparator/.lake/build/bin/comparator "$cfg" < /dev/null \
                 | tee "comparator-logs/$X.log" \
               && grep -Fxq "Your solution is okay!" "comparator-logs/$X.log"; then
              echo "$X: OK"
            else
              echo "$X: FAILED"
              fail=1
            fi
            checked=$((checked + 1))
            echo "::endgroup::"
          done
          [ "$checked" -ge 1 ] || { echo "No comparator pair ran."; exit 1; }
          exit "$fail"

      - name: Upload comparator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparator-logs
          path: |
            IDLA-Mated-CRT/comparator-logs/
            IDLA-Mated-CRT/audit-build.log
          if-no-files-found: warn
